<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="按官方名称、年份、空间尺度与已核实获取入口检索全球环境数据。">
  <title>AerosolCity · 全球数据目录</title>
  <link rel="stylesheet" href="./styles.css?v=d034-r02">
  <script src="./app.js?v=d034-r02" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="AerosolCity 全球数据目录首页">
      <span class="brand-name">AerosolCity</span>
      <span class="brand-divider" aria-hidden="true">/</span>
      <span class="brand-subtitle">全球数据目录</span>
    </a>
    <a class="header-link" href="#catalog">浏览目录 <span aria-hidden="true">↓</span></a>
  </header>

  <main id="top" class="page-shell">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">全球环境数据</p>
      <h1 id="page-title">按数据实际范围检索</h1>
      <p class="intro-note">来源记录、本地取得范围与本站文件范围分别说明。未核实的身份与入口会明确标出。</p>
    </section>

    <section id="catalog" class="catalog" aria-label="全球数据产品目录">
      <form id="filters" class="filter-panel" role="search" autocomplete="off">
        <div class="search-field">
          <label for="search-input">搜索</label>
          <input id="search-input" type="search" placeholder="产品名、变量、年份…" aria-describedby="search-help">
          <span id="search-help" class="visually-hidden">搜索会匹配产品名称、用途、变量、来源记录和稳定键。</span>
        </div>
        <div class="primary-filters">
          <fieldset class="line-fieldset">
            <legend>研究主线</legend>
            <div id="line-filters" class="line-filters"></div>
          </fieldset>
          <div class="access-filter">
            <label for="access-filter">获取方式</label>
            <select id="access-filter"><option value="">全部方式</option></select>
          </div>
          <button id="clear-filters" class="reset-button" type="button">重置筛选</button>
        </div>
        <details id="advanced-filters" class="advanced-filters">
          <summary>更多筛选</summary>
          <div class="advanced-grid">
            <div class="filter-control"><label for="source-year">来源年份</label><select id="source-year"><option value="">不限</option></select></div>
            <div class="filter-control"><label for="local-year">本地取得年份</label><select id="local-year"><option value="">不限</option></select></div>
            <div class="filter-control"><label for="hosted-year">本站文件年份</label><select id="hosted-year"><option value="">不限</option></select></div>
            <div class="filter-control"><label for="source-frequency">来源时间步长</label><select id="source-frequency"><option value="">不限</option></select></div>
            <div class="filter-control"><label for="native-resolution">原生空间尺度</label><select id="native-resolution"><option value="">不限</option></select></div>
            <div class="filter-control"><label for="type-filter">数据类型</label><select id="type-filter"><option value="">不限</option></select></div>
            <div class="filter-control"><label for="format-filter">原始格式</label><select id="format-filter"><option value="">不限</option></select></div>
          </div>
          <p class="filter-note">三个年份条件彼此独立；筛选使用记录中的明确年份，不从其他范围推算。</p>
        </details>
      </form>

      <section class="results" aria-labelledby="results-title">
        <div class="results-heading">
          <h2 id="results-title">数据产品</h2>
          <p class="match-count" aria-live="polite"><strong id="result-count">—</strong><span>条匹配记录</span></p>
        </div>
        <div id="active-filters" class="active-filters" aria-live="polite"></div>
        <div id="catalog-error" class="message error-message" role="alert" hidden></div>
        <div id="product-list" class="product-list" aria-live="polite"></div>
        <div id="empty-state" class="message empty-state" hidden>
          <h3>没有找到匹配记录</h3>
          <p>减少筛选条件，或换一个产品名、变量名或稳定键。</p>
          <button id="empty-clear" class="reset-button" type="button">清除筛选</button>
        </div>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <p>获取入口只表示记录中已核实的访问方式；不代表质量或许可已全面通过。</p>
    <a href="#top">返回顶部 ↑</a>
  </footer>
</body>
</html>
